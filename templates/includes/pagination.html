{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="mt-5">
    <ul class="pagination justify-content-center">
        {% if page_obj.has_previous %}
            <li class="page-item">
                <a class="page-link" href="?{{ query_params|urlencode }}&amp;page=1">
                    <i class="bi bi-chevron-double-left"></i> First
                </a>
            </li>
            <li class="page-item">
                <a class="page-link" href="?{{ query_params|urlencode }}&amp;page={{ page_obj.previous_page_number }}">
                    <i class="bi bi-chevron-left"></i> Prev
                </a>
            </li>
        {% endif %}

        <li class="page-item disabled">
            <span class="page-link bg-light">
                Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
            </span>
        </li>

        {% if page_obj.has_next %}
            <li class="page-item">
                <a class="page-link" href="?{{ query_params|urlencode }}&amp;page={{ page_obj.next_page_number }}">
                    Next <i class="bi bi-chevron-right"></i>
                </a>
            </li>
            <li class="page-item">
                <a class="page-link" href="?{{ query_params|urlencode }}&amp;page={{ page_obj.paginator.num_pages }}">
                    Last <i class="bi bi-chevron-double-right"></i>
                </a>
            </li>
        {% endif %}
    </ul>
</nav>
{% endif %}
