{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="keywords"
      content="movies, streaming, watchlist, telegram, MoviesHub"
    />

    <title>MoviesHub - {% block title %}Home{% endblock %}</title>

    <!-- Favicon (placeholder – replace with your own) -->
    <link rel="icon" type="image/png" href="{% static 'images/movieshublogo.png' %}" />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Custom Global Styles -->
    <style>
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }

      /* Ensure footer sticks to bottom */
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background-color: #f8f9fa;
      }
      .container.my-4 {
        flex: 1;
      }

      /* Custom scrollbar (optional) */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }

      /* Consistent card hover (used across templates) */
      .hover-card {
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .hover-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
      }
      .rounded-4 {
        border-radius: 1rem;
      }
      .cursor-pointer {
        cursor: pointer;
      }
    </style>

    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <!-- Navigation Bar -->
    {% include 'navbar.html' %}

    <!-- Messages (Alerts) -->
    {% include 'messages.html' %}

    <!-- Main Content -->
    <div class="container my-4">{% block content %} {% endblock %}</div>

    <!-- Footer -->
    {% include 'footer.html' %}

    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Optional: Global JS for tooltips/popups -->
    <script>
      // Enable Bootstrap tooltips everywhere (if needed)
      document.addEventListener("DOMContentLoaded", function () {
        var tooltipTriggerList = [].slice.call(
          document.querySelectorAll('[data-bs-toggle="tooltip"]'),
        );
        tooltipTriggerList.map(function (tooltipTriggerEl) {
          return new bootstrap.Tooltip(tooltipTriggerEl);
        });
      });
    </script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
