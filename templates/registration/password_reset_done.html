{% extends 'base.html' %}

{% block title %}Email Sent | MoviesHub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 text-center overflow-hidden">
                <div class="card-header bg-success text-white py-3">
                    <i class="bi bi-check-circle-fill fs-1"></i>
                    <h4 class="mb-0 fw-bold mt-1">Email Sent</h4>
                </div>
                <div class="card-body p-4">
                    <p class="mb-4">
                        We've emailed you instructions for setting your password.
                        You should receive it shortly.
                    </p>
                    <a href="{% url 'login' %}" class="btn btn-primary px-4">
                        <i class="bi bi-box-arrow-in-right"></i> Back to Login
                    </a>
                </div>
                <div class="card-footer bg-white text-muted small py-2">
                    <i class="bi bi-envelope"></i> Check your spam folder if you don't see it.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
